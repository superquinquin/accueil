[project]
name = "accueil"
version = "0.6.0"
description = "simple interface for odoo annotating members attendance"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "attrs>=23.2.0",
    "sanic>=23.12.1",
    "sanic-ext>=23.12.0",
    "requests>=2.32.3",
    "odooly>=2.6.6",
    "pydantic>=2.13.5",
    "jinja2>=3.1.6",
]
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "requests>=2.34.2",
]
